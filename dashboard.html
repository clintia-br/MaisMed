<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="robots" content="noindex, nofollow" />
<title>Relatório de Performance — Clínica Mais Med</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #0a0a0a;
  --s1:        #141414;
  --s2:        #1c1c1c;
  --s3:        #252525;
  --border:    rgba(255,255,255,0.06);
  --border2:   rgba(255,255,255,0.11);
  --text:      #f5f5f5;
  --t2:        #a3a3a3;
  --t3:        #6b6b6b;
  --teal:      #0E9F8E;
  --teal-l:    #22c9b4;
  --teal-bg:   rgba(14,159,142,.12);
  --google:    #4285F4;
  --google-bg: rgba(66,133,244,.1);
  --meta:      #1877F2;
  --meta-bg:   rgba(24,119,242,.1);
  --green:     #22c55e;
  --amber:     #f59e0b;
  --amber-bg:  rgba(245,158,11,.1);
  --red:       #ef4444;
  --r:         10px;
  --r-sm:      6px;
}

html { scroll-behavior: smooth; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg); color: var(--text);
  -webkit-font-smoothing: antialiased;
  font-size: 14px; line-height: 1.55;
}

/* ── SELETOR DE MÊS ── */
.switch { background: var(--s1); border-bottom: 1px solid var(--border); }
.switch-inner { max-width: 1140px; margin: 0 auto; padding: 12px 24px; display: flex; gap: 8px; flex-wrap: wrap; }
.switch-btn {
  background: none; border: 1px solid var(--border2); color: var(--t2);
  font-family: inherit; font-size: 12px; font-weight: 600; letter-spacing: .01em;
  padding: 7px 15px; border-radius: 999px; cursor: pointer; transition: all .2s;
}
.switch-btn:hover { color: var(--text); border-color: var(--teal-l); }
.switch-btn.active { background: var(--teal); color: #fff; border-color: var(--teal); }

/* ── HEADER ── */
.hdr { background: var(--s1); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
.hdr-row { max-width: 1140px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 13px 24px; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 9px; }
.brand-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 12px var(--teal); }
.brand-name { font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
.period-chip {
  font-size: 11px; font-weight: 500; color: var(--teal-l);
  background: var(--teal-bg); border: 1px solid rgba(14,159,142,.25);
  padding: 5px 11px; border-radius: 999px;
}
.tabs { max-width: 1140px; margin: 0 auto; padding: 0 24px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  background: none; border: none; border-bottom: 2px solid transparent;
  color: var(--t2); font-family: inherit; font-size: 13px; font-weight: 500;
  padding: 11px 14px; cursor: pointer; white-space: nowrap; transition: color .2s, border-color .2s;
}
.tab:hover { color: var(--text); }
.tab.on { color: var(--teal-l); border-bottom-color: var(--teal-l); }

/* ── LAYOUT ── */
.sec { display: none; }
.sec.on { display: block; }
.wrap { max-width: 1140px; margin: 0 auto; padding: 32px 24px 72px; }
.ey { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--t3); margin-bottom: 8px; }
.ttl { font-size: 26px; font-weight: 700; letter-spacing: -.025em; margin-bottom: 8px; }
.sub { font-size: 13px; color: var(--t2); margin-bottom: 26px; max-width: 720px; }

/* ── ALERTAS ── */
.alert { display: flex; gap: 13px; padding: 15px 18px; border-radius: var(--r); margin-bottom: 24px; border: 1px solid; }
.alert.amber { background: var(--amber-bg); border-color: rgba(245,158,11,.25); }
.alert.teal  { background: var(--teal-bg);  border-color: rgba(14,159,142,.25); }
.alert-icon { font-size: 17px; line-height: 1.3; flex-shrink: 0; }
.alert-title { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
.alert-text { font-size: 12px; color: var(--t2); line-height: 1.55; }

/* ── KPIs ── */
.kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 26px; }
@media (max-width: 760px) { .kpi-grid { grid-template-columns: 1fr; } }
.kpi { background: var(--s1); border: 1px solid var(--border); border-radius: var(--r); padding: 18px 20px; position: relative; overflow: hidden; }
.kpi::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: var(--teal); }
.kpi.go::before { background: var(--google); }
.kpi.mt::before { background: var(--meta); }
.kpi-lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--t3); margin-bottom: 10px; }
.kpi-val { font-size: 28px; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; }
.kpi-val-sm { font-size: 24px; }
.kpi-note { font-size: 11px; color: var(--t2); margin-top: 5px; }
.badge { display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 500; padding: 3px 8px; border-radius: var(--r-sm); margin-top: 10px; }
.badge.neu { background: var(--s3); color: var(--t2); }
.badge.up  { background: rgba(34,197,94,.12); color: var(--green); }
.badge.dn  { background: rgba(239,68,68,.12); color: var(--red); }

/* ── CARDS / TABELAS ── */
.tcard { background: var(--s1); border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 24px; overflow: hidden; }
.tcard-hdr { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.tcard-ttl { font-size: 13px; font-weight: 600; }
.chip { font-size: 10px; color: var(--t3); background: var(--s3); padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
.tbl-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 560px; }
th { text-align: left; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--t3); padding: 11px 20px; border-bottom: 1px solid var(--border); background: var(--s2); white-space: nowrap; }
th.r { text-align: right; }
td { padding: 11px 20px; font-size: 13px; border-bottom: 1px solid var(--border); }
td.r { text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 11px; white-space: nowrap; }
td.cam { font-size: 11px; color: var(--t2); max-width: 260px; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: rgba(255,255,255,.02); }
tfoot td { padding: 12px 20px; font-size: 11px; font-weight: 600; background: var(--s2); font-family: 'JetBrains Mono', monospace; border-top: 1px solid var(--border); }
tfoot td:first-child { font-family: 'Inter', sans-serif; font-size: 12px; }
td.pos { color: var(--green); }
td.neg { color: var(--red); }
.plat-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 7px; vertical-align: middle; }

/* ── BARRAS ── */
.chart-ttl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--t3); padding: 15px 20px 10px; border-top: 1px solid var(--border); }
.bars { padding: 2px 20px 18px; }
.bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
.bar-lbl { width: 210px; font-size: 10px; color: var(--t2); text-align: right; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-tr { flex: 1; height: 18px; background: var(--s3); border-radius: 4px; overflow: hidden; }
.bar-fi { height: 100%; border-radius: 4px; min-width: 2px; transition: width .35s ease; }
.bar-vl { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--t2); width: 82px; flex-shrink: 0; }

/* ── DISTRIBUIÇÃO ── */
.dist-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
@media (max-width: 620px) { .dist-grid { grid-template-columns: 1fr; } }
.dist-card { background: var(--s1); border: 1px solid var(--border); border-radius: var(--r); padding: 18px 20px; }
.dist-ttl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--t3); margin-bottom: 13px; }
.dist-bar { height: 7px; background: var(--s3); border-radius: 4px; overflow: hidden; display: flex; gap: 2px; margin-bottom: 13px; }
.dist-g { height: 100%; background: var(--google); }
.dist-m { height: 100%; background: var(--meta); }
.dist-leg { display: flex; gap: 18px; flex-wrap: wrap; }
.dl { display: flex; align-items: flex-start; gap: 7px; }
.dl-dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
.dl-lbl { font-size: 11px; color: var(--t2); }
.dl-val { font-size: 15px; font-weight: 700; letter-spacing: -.02em; }
.dl-pct { font-size: 10px; color: var(--t3); }

/* ── INSIGHTS ── */
.insights { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 24px; }
@media (max-width: 620px) { .insights { grid-template-columns: 1fr; } }
.insight { background: var(--s1); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 15px 17px; }
.ins-icon { font-size: 16px; margin-bottom: 7px; }
.ins-ttl { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
.ins-txt { font-size: 11px; color: var(--t2); line-height: 1.55; }

/* ── ESTADO VAZIO / SETUP ── */
.setup { max-width: 780px; margin: 0 auto; padding: 56px 24px 80px; }
.setup h1 { font-size: 24px; font-weight: 700; letter-spacing: -.025em; margin-bottom: 10px; }
.setup .lead { font-size: 14px; color: var(--t2); margin-bottom: 30px; line-height: 1.6; }
.step { display: flex; gap: 14px; background: var(--s1); border: 1px solid var(--border); border-radius: var(--r); padding: 17px 19px; margin-bottom: 10px; }
.step-num { width: 24px; height: 24px; border-radius: 6px; background: var(--teal-bg); color: var(--teal-l); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.step-ttl { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.step-txt { font-size: 12px; color: var(--t2); line-height: 1.6; }
.step-txt code { font-family: 'JetBrains Mono', monospace; font-size: 11px; background: var(--s3); padding: 1px 5px; border-radius: 4px; color: var(--teal-l); }
.pend { display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; padding: 3px 8px; border-radius: 999px; margin-left: 8px; }
.pend.block { background: rgba(239,68,68,.12); color: var(--red); }
.pend.ok { background: rgba(34,197,94,.12); color: var(--green); }

.foot { border-top: 1px solid var(--border); padding: 22px 24px 40px; text-align: center; font-size: 11px; color: var(--t3); }

@media (max-width: 620px) {
  .wrap { padding: 24px 16px 60px; }
  .hdr-row { padding: 11px 16px; }
  .tabs { padding: 0 16px; }
  .switch-inner { padding: 10px 16px; }
  .kpi-val { font-size: 23px; }
  .bar-lbl { width: 120px; font-size: 9px; }
  th, td { padding: 10px 14px; }
  .bar-vl { width: 66px; font-size: 9px; }
}
</style>
</head>
<body>

<div id="app"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   DADOS DO RELATÓRIO — única parte que se edita a cada fechamento mensal.
   Todo o resto da página (KPIs, totais, CPL/CPR, CTR, %, ritmo diário,
   projeções, barras) é calculado automaticamente a partir daqui.

   Google Ads  → export "Campanhas" (Custo, Impr., Cliques, Conversões)
   Meta Ads    → Meta Ads MCP / Gerenciador (spend, impressions, reach, results)

   Estrutura de um mês:
   {
     id:        'agosto-2026',            // slug único
     rotulo:    'Agosto 2026',            // texto do botão
     periodo:   '01/08 – 25/08',          // texto do chip do cabeçalho
     dias:      25,                       // dias com veiculação no recorte
     diasNoMes: 31,                       // total de dias do mês
     parcial:   true,                     // true = mês em andamento
     orcamento: { google: 0, meta: 0 },   // opcional: verba prevista no recorte
     google:    [ { nome, investimento, impressoes, cliques, leads } ],
     meta:      [ { nome, investimento, impressoes, alcance, conversas } ],
     planoDiario: [ { especialidade, google, meta } ],   // opcional
     alertas:   [ { tipo:'amber'|'teal', icone, titulo, texto } ],  // opcional
     destaques: [ { icone, titulo, texto } ]                        // opcional
   }
   ═══════════════════════════════════════════════════════════════════════ */

const DADOS = {
  cliente:  'Clínica Mais Med',
  operador: 'Clintia',
  meses: [
    /* Nenhum mês fechado ainda. Ao receber o primeiro recorte, adicione um
       objeto de mês aqui seguindo a estrutura documentada acima. */
  ]
};

/* ═══════════════════════════════════════════════════════════════════════
   FORMATAÇÃO
   ═══════════════════════════════════════════════════════════════════════ */
const brl   = n => 'R$ ' + n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const brl0  = n => 'R$ ' + n.toLocaleString('pt-BR', { maximumFractionDigits: 0 });
const num   = (n, c = 0) => n.toLocaleString('pt-BR', { minimumFractionDigits: c, maximumFractionDigits: c });
const pct   = n => num(n, 1).replace('.', ',') + '%';
const div   = (a, b) => (b ? a / b : 0);
const esc   = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

/* ═══════════════════════════════════════════════════════════════════════
   AGREGAÇÃO
   ═══════════════════════════════════════════════════════════════════════ */
function somaGoogle(cs) {
  const t = cs.reduce((a, c) => ({
    investimento: a.investimento + (c.investimento || 0),
    impressoes:   a.impressoes   + (c.impressoes   || 0),
    cliques:      a.cliques      + (c.cliques      || 0),
    leads:        a.leads        + (c.leads        || 0)
  }), { investimento: 0, impressoes: 0, cliques: 0, leads: 0 });
  t.cpl = div(t.investimento, t.leads);
  t.ctr = div(t.cliques, t.impressoes) * 100;
  return t;
}

function somaMeta(cs) {
  const t = cs.reduce((a, c) => ({
    investimento: a.investimento + (c.investimento || 0),
    impressoes:   a.impressoes   + (c.impressoes   || 0),
    alcance:      a.alcance      + (c.alcance      || 0),
    conversas:    a.conversas    + (c.conversas    || 0)
  }), { investimento: 0, impressoes: 0, alcance: 0, conversas: 0 });
  t.cpr = div(t.investimento, t.conversas);
  return t;
}

function consolidar(mes) {
  const g = somaGoogle(mes.google || []);
  const m = somaMeta(mes.meta || []);
  const investimento = g.investimento + m.investimento;
  const resultados   = g.leads + m.conversas;
  return {
    g, m, investimento, resultados,
    cpr:            div(investimento, resultados),
    investDia:      div(investimento, mes.dias),
    resultadosDia:  div(resultados, mes.dias),
    pctInvestG:     div(g.investimento, investimento) * 100,
    pctInvestM:     div(m.investimento, investimento) * 100,
    pctResG:        div(g.leads, resultados) * 100,
    pctResM:        div(m.conversas, resultados) * 100
  };
}

/* ═══════════════════════════════════════════════════════════════════════
   COMPONENTES
   ═══════════════════════════════════════════════════════════════════════ */
function kpi(classe, rotulo, valor, nota, badge, badgeTipo) {
  return `<div class="kpi ${classe}">
    <div class="kpi-lbl">${rotulo}</div>
    <div class="kpi-val ${String(valor).length > 8 ? 'kpi-val-sm' : ''}">${valor}</div>
    ${nota ? `<div class="kpi-note">${nota}</div>` : ''}
    ${badge ? `<div class="badge ${badgeTipo || 'neu'}">${badge}</div>` : ''}
  </div>`;
}

function card(titulo, chip, corpo) {
  return `<div class="tcard">
    <div class="tcard-hdr">
      <span class="tcard-ttl">${titulo}</span>
      ${chip ? `<span class="chip">${chip}</span>` : ''}
    </div>
    ${corpo}
  </div>`;
}

function barras(titulo, itens, cor, formatar) {
  if (!itens.length) return '';
  const max = Math.max(...itens.map(i => i.valor)) || 1;
  return `<div class="chart-ttl">${titulo}</div><div class="bars">` +
    itens.map(i => `<div class="bar-row">
      <span class="bar-lbl" title="${esc(i.nome)}">${esc(i.nome)}</span>
      <div class="bar-tr"><div class="bar-fi" style="width:${(i.valor / max * 100).toFixed(1)}%;background:${cor}"></div></div>
      <span class="bar-vl">${formatar(i.valor)}</span>
    </div>`).join('') + '</div>';
}

function alertas(lista) {
  return (lista || []).map(a => `<div class="alert ${a.tipo || 'amber'}">
    <div class="alert-icon">${a.icone || '⚠️'}</div>
    <div>
      <div class="alert-title">${esc(a.titulo)}</div>
      <div class="alert-text">${esc(a.texto)}</div>
    </div>
  </div>`).join('');
}

function destaques(lista) {
  if (!lista || !lista.length) return '';
  return '<div class="insights">' + lista.map(d => `<div class="insight">
    <div class="ins-icon">${d.icone || '📌'}</div>
    <div class="ins-ttl">${esc(d.titulo)}</div>
    <div class="ins-txt">${esc(d.texto)}</div>
  </div>`).join('') + '</div>';
}

/* ═══════════════════════════════════════════════════════════════════════
   SEÇÃO · VISÃO GERAL
   ═══════════════════════════════════════════════════════════════════════ */
function secGeral(mes) {
  const c = consolidar(mes);
  const nCampanhas = (mes.google || []).length + (mes.meta || []).length;

  const avisoParcial = mes.parcial ? [{
    tipo: 'amber', icone: '📅',
    titulo: `Mês em andamento — dados de ${mes.periodo}`,
    texto: `Os totais abaixo cobrem ${mes.dias} dos ${mes.diasNoMes} dias do mês e não devem ser comparados diretamente com os totais de meses fechados. Para leitura justa entre meses, use o ritmo diário.`
  }] : [];

  /* ── Ritmo diário: comparação justa entre meses ── */
  const outros = DADOS.meses.filter(m => m.id !== mes.id);
  const linhaRitmo = m => {
    const x = consolidar(m);
    return `<tr>
      <td>${esc(m.rotulo)}${m.parcial ? ' (parcial)' : ''}</td>
      <td class="r">${m.dias}</td>
      <td class="r">${brl(x.investDia)}</td>
      <td class="r">${num(x.resultadosDia, 1)}</td>
      <td class="r">${brl(x.cpr)}</td>
    </tr>`;
  };
  const ritmo = card('Ritmo Diário — comparação justa entre meses', 'Google + Meta', `
    <div class="tbl-scroll"><table>
      <thead><tr><th>Período</th><th class="r">Dias</th><th class="r">Investimento/dia</th><th class="r">Resultados/dia</th><th class="r">CPL / CPR</th></tr></thead>
      <tbody>${outros.map(linhaRitmo).join('') || '<tr><td colspan="5" style="color:var(--t3);font-size:12px">Sem outros meses para comparar ainda.</td></tr>'}</tbody>
      <tfoot><tr>
        <td>${esc(mes.rotulo)}${mes.parcial ? ' (parcial)' : ''}</td>
        <td class="r">${mes.dias}</td>
        <td class="r">${brl(c.investDia)}</td>
        <td class="r">${num(c.resultadosDia, 1)}</td>
        <td class="r">${brl(c.cpr)}</td>
      </tr></tfoot>
    </table></div>`);

  /* ── Comparativo por plataforma ── */
  const plataformas = card('Comparativo por Plataforma', '', `
    <div class="tbl-scroll"><table>
      <thead><tr><th>Plataforma</th><th class="r">Investimento</th><th class="r">Resultados</th><th class="r">CPL / CPR</th><th class="r">% do Invest.</th></tr></thead>
      <tbody>
        <tr>
          <td><span class="plat-dot" style="background:var(--google)"></span>Google Ads</td>
          <td class="r">${brl(c.g.investimento)}</td>
          <td class="r">${num(c.g.leads, 1)} leads</td>
          <td class="r">${brl(c.g.cpl)}</td>
          <td class="r">${pct(c.pctInvestG)}</td>
        </tr>
        <tr>
          <td><span class="plat-dot" style="background:var(--meta)"></span>Meta Ads</td>
          <td class="r">${brl(c.m.investimento)}</td>
          <td class="r">${num(c.m.conversas, 0)} conversas</td>
          <td class="r">${brl(c.m.cpr)}</td>
          <td class="r">${pct(c.pctInvestM)}</td>
        </tr>
      </tbody>
      <tfoot><tr>
        <td>Total Geral</td>
        <td class="r">${brl(c.investimento)}</td>
        <td class="r">${num(c.resultados, 1)} resultados</td>
        <td class="r">${brl(c.cpr)}</td>
        <td class="r">100%</td>
      </tr></tfoot>
    </table></div>`);

  /* ── Distribuição ── */
  const distribuicao = `<div class="dist-grid">
    <div class="dist-card">
      <div class="dist-ttl">Investimento</div>
      <div class="dist-bar"><div class="dist-g" style="width:${c.pctInvestG.toFixed(1)}%"></div><div class="dist-m" style="width:${c.pctInvestM.toFixed(1)}%"></div></div>
      <div class="dist-leg">
        <div class="dl"><div class="dl-dot" style="background:var(--google)"></div><div><div class="dl-lbl">Google Ads</div><div class="dl-val">${brl0(c.g.investimento)}</div><div class="dl-pct">${pct(c.pctInvestG)}</div></div></div>
        <div class="dl"><div class="dl-dot" style="background:var(--meta)"></div><div><div class="dl-lbl">Meta Ads</div><div class="dl-val">${brl0(c.m.investimento)}</div><div class="dl-pct">${pct(c.pctInvestM)}</div></div></div>
      </div>
    </div>
    <div class="dist-card">
      <div class="dist-ttl">Resultados</div>
      <div class="dist-bar"><div class="dist-g" style="width:${c.pctResG.toFixed(1)}%"></div><div class="dist-m" style="width:${c.pctResM.toFixed(1)}%"></div></div>
      <div class="dist-leg">
        <div class="dl"><div class="dl-dot" style="background:var(--google)"></div><div><div class="dl-lbl">Google Ads</div><div class="dl-val">${num(c.g.leads, 0)} leads</div><div class="dl-pct">${pct(c.pctResG)}</div></div></div>
        <div class="dl"><div class="dl-dot" style="background:var(--meta)"></div><div><div class="dl-lbl">Meta Ads</div><div class="dl-val">${num(c.m.conversas, 0)} conv.</div><div class="dl-pct">${pct(c.pctResM)}</div></div></div>
      </div>
    </div>
  </div>`;

  /* ── Plano diário por especialidade ── */
  let plano = '';
  if (mes.planoDiario && mes.planoDiario.length) {
    const tg = mes.planoDiario.reduce((a, p) => a + (p.google || 0), 0);
    const tm = mes.planoDiario.reduce((a, p) => a + (p.meta || 0), 0);
    plano = card('Investimento Diário por Especialidade', 'Orçamento diário planejado', `
      <div class="tbl-scroll"><table>
        <thead><tr><th>Especialidade</th><th class="r">Google Ads /dia</th><th class="r">Meta Ads /dia</th><th class="r">Total /dia</th></tr></thead>
        <tbody>${mes.planoDiario.slice().sort((a, b) => ((b.google || 0) + (b.meta || 0)) - ((a.google || 0) + (a.meta || 0))).map(p => `<tr>
          <td class="cam">${esc(p.especialidade)}</td>
          <td class="r">${p.google ? brl(p.google) : '—'}</td>
          <td class="r">${p.meta ? brl(p.meta) : '—'}</td>
          <td class="r">${brl((p.google || 0) + (p.meta || 0))}</td>
        </tr>`).join('')}</tbody>
        <tfoot><tr><td>Total Geral</td><td class="r">${brl(tg)}</td><td class="r">${brl(tm)}</td><td class="r">${brl(tg + tm)}</td></tr></tfoot>
      </table></div>`);
  }

  /* ── Orçamento esperado x investido real ── */
  let orcamento = '';
  if (mes.orcamento) {
    const og = mes.orcamento.google || 0, om = mes.orcamento.meta || 0;
    const linha = (nome, cor, real, prev) => {
      const dif = prev - real;
      const cls = dif >= 0 ? 'pos' : 'neg';
      return `<tr>
        <td><span class="plat-dot" style="background:${cor}"></span>${nome}</td>
        <td class="r">${brl(real)}</td>
        <td class="r">${brl(prev)}</td>
        <td class="r ${cls}">${dif >= 0 ? '+' : '−'}${brl(Math.abs(dif))}</td>
        <td class="r ${cls}">${pct(div(real, prev) * 100)}</td>
      </tr>`;
    };
    const difT = (og + om) - c.investimento;
    orcamento = card('Orçamento Esperado x Investido Real', mes.periodo + ` (${mes.dias} dias)`, `
      <div class="tbl-scroll"><table>
        <thead><tr><th>Plataforma</th><th class="r">Investido Real</th><th class="r">Orçamento Esperado</th><th class="r">Diferença</th><th class="r">% Consumido</th></tr></thead>
        <tbody>
          ${linha('Google Ads', 'var(--google)', c.g.investimento, og)}
          ${linha('Meta Ads', 'var(--meta)', c.m.investimento, om)}
        </tbody>
        <tfoot><tr>
          <td>Total Geral</td>
          <td class="r">${brl(c.investimento)}</td>
          <td class="r">${brl(og + om)}</td>
          <td class="r ${difT >= 0 ? 'pos' : 'neg'}">${difT >= 0 ? '+' : '−'}${brl(Math.abs(difT))}</td>
          <td class="r ${difT >= 0 ? 'pos' : 'neg'}">${pct(div(c.investimento, og + om) * 100)}</td>
        </tr></tfoot>
      </table></div>`);
  }

  /* ── Projeção com base no ritmo diário ── */
  const proj = d => `${brl0(c.investDia * d)}`;
  const projNota = d => `Google ${brl0(div(c.g.investimento, mes.dias) * d)} · Meta ${brl0(div(c.m.investimento, mes.dias) * d)}`;
  const projecao = card('Projeção de Investimento', 'Com base no ritmo diário atual', `
    <div style="padding:20px"><div class="kpi-grid" style="margin-bottom:0">
      ${kpi('tc', 'Próximos 7 dias', proj(7), projNota(7))}
      ${kpi('tc', 'Próximos 15 dias', proj(15), projNota(15))}
      ${kpi('tc', 'Próximos 30 dias', proj(30), projNota(30))}
    </div></div>`);

  return `<div class="wrap">
    <div class="ey">${mes.parcial ? 'Consolidado Parcial' : 'Consolidado'} · ${esc(mes.rotulo)}</div>
    <h1 class="ttl">Performance Geral</h1>
    <p class="sub">Google Ads + Meta Ads · ${nCampanhas} campanhas com veiculação · ${mes.dias} ${mes.parcial ? `dos ${mes.diasNoMes} dias do mês` : 'dias'}.</p>
    ${alertas(avisoParcial.concat(mes.alertas || []))}
    <div class="kpi-grid">
      ${kpi('tc', 'Investimento Total', brl0(c.investimento), `Google + Meta Ads · ${mes.dias} dias`, `${brl(c.investDia)} / dia`)}
      ${kpi('tc', 'Total de Resultados', num(c.resultados, 0), 'Leads + Conversas', `${num(c.resultadosDia, 1)} / dia`)}
      ${kpi('tc', 'CPL / CPR Consolidado', brl(c.cpr), 'Custo médio por resultado', `${num(c.resultados, 0)} resultados`)}
    </div>
    ${ritmo}${plataformas}${distribuicao}${plano}${orcamento}${projecao}${destaques(mes.destaques)}
  </div>`;
}

/* ═══════════════════════════════════════════════════════════════════════
   SEÇÃO · GOOGLE ADS
   ═══════════════════════════════════════════════════════════════════════ */
function tabelaGoogle(cs, t) {
  return `<div class="tbl-scroll"><table>
    <thead><tr><th>Campanha</th><th class="r">Investimento</th><th class="r">Leads</th><th class="r">CPL</th><th class="r">CTR</th><th class="r">Impressões</th></tr></thead>
    <tbody>${cs.map(c => `<tr>
      <td class="cam">${esc(c.nome)}</td>
      <td class="r">${brl(c.investimento)}</td>
      <td class="r">${num(c.leads, 1)}</td>
      <td class="r">${brl(div(c.investimento, c.leads))}</td>
      <td class="r">${pct(div(c.cliques, c.impressoes) * 100)}</td>
      <td class="r">${num(c.impressoes)}</td>
    </tr>`).join('')}</tbody>
    <tfoot><tr>
      <td>Total Google Ads</td>
      <td class="r">${brl(t.investimento)}</td>
      <td class="r">${num(t.leads, 1)} leads</td>
      <td class="r">CPL ${brl(t.cpl)}</td>
      <td class="r">${pct(t.ctr)}</td>
      <td class="r">${num(t.impressoes)}</td>
    </tr></tfoot>
  </table></div>`;
}

function secGoogle(mes) {
  const cs = (mes.google || []).slice().sort((a, b) => b.leads - a.leads);
  const t = somaGoogle(cs);
  if (!cs.length) return vazio('Google Ads', 'Nenhuma campanha do Google Ads com veiculação neste recorte.');
  return `<div class="wrap">
    <div class="ey" style="color:var(--google)">Google Ads · ${esc(mes.rotulo)}${mes.parcial ? ' (parcial)' : ''}</div>
    <h1 class="ttl">Campanhas de Pesquisa</h1>
    <p class="sub">${cs.length} campanhas ativas · ${mes.periodo} · dados do export "Campanhas" do Google Ads.</p>
    <div class="kpi-grid">
      ${kpi('go', 'Investimento', brl0(t.investimento), `${cs.length} campanhas · ${mes.dias} dias`, `${brl(div(t.investimento, mes.dias))} / dia`)}
      ${kpi('go', 'Total de Leads', num(t.leads, 0), 'Conversões no período', `${num(div(t.leads, mes.dias), 1)} leads / dia`)}
      ${kpi('go', 'CPL Médio', brl(t.cpl), `CTR médio de ${pct(t.ctr)}`, `${num(t.cliques)} cliques`)}
    </div>
    ${card('Detalhamento por Campanha', 'ordenado por leads ↓',
      tabelaGoogle(cs, t) +
      barras('Investimento por Campanha', cs.slice().sort((a, b) => b.investimento - a.investimento).map(c => ({ nome: c.nome, valor: c.investimento })), 'var(--google)', brl0) +
      barras('Leads por Campanha', cs.map(c => ({ nome: c.nome, valor: c.leads })), 'var(--teal)', v => num(v, 0) + ' leads')
    )}
  </div>`;
}

/* ═══════════════════════════════════════════════════════════════════════
   SEÇÃO · META ADS
   ═══════════════════════════════════════════════════════════════════════ */
function tabelaMeta(cs, t) {
  return `<div class="tbl-scroll"><table>
    <thead><tr><th>Campanha</th><th class="r">Investimento</th><th class="r">Conversas</th><th class="r">CPR</th><th class="r">Impressões</th><th class="r">Alcance</th></tr></thead>
    <tbody>${cs.map(c => `<tr>
      <td class="cam">${esc(c.nome)}</td>
      <td class="r">${brl(c.investimento)}</td>
      <td class="r">${num(c.conversas)}</td>
      <td class="r">${brl(div(c.investimento, c.conversas))}</td>
      <td class="r">${num(c.impressoes)}</td>
      <td class="r">${num(c.alcance)}</td>
    </tr>`).join('')}</tbody>
    <tfoot><tr>
      <td>Total Meta Ads</td>
      <td class="r">${brl(t.investimento)}</td>
      <td class="r">${num(t.conversas)} conversas</td>
      <td class="r">CPR ${brl(t.cpr)}</td>
      <td class="r">${num(t.impressoes)}</td>
      <td class="r">${num(t.alcance)}</td>
    </tr></tfoot>
  </table></div>`;
}

function secMeta(mes) {
  const cs = (mes.meta || []).slice().sort((a, b) => b.conversas - a.conversas);
  const t = somaMeta(cs);
  if (!cs.length) return vazio('Meta Ads', 'Nenhuma campanha do Meta Ads com veiculação neste recorte.');
  return `<div class="wrap">
    <div class="ey" style="color:var(--meta)">Meta Ads · ${esc(mes.rotulo)}${mes.parcial ? ' (parcial)' : ''}</div>
    <h1 class="ttl">Campanhas de Conversas</h1>
    <p class="sub">${cs.length} campanhas com veiculação · ${mes.periodo} · dados puxados direto da conta via Meta Ads MCP.</p>
    <div class="kpi-grid">
      ${kpi('mt', 'Investimento', brl0(t.investimento), `${cs.length} campanhas · ${mes.dias} dias`, `${brl(div(t.investimento, mes.dias))} / dia`)}
      ${kpi('mt', 'Total de Conversas', num(t.conversas), 'Conversas iniciadas', `${num(div(t.conversas, mes.dias), 1)} conversas / dia`)}
      ${kpi('mt', 'CPR Médio', brl(t.cpr), 'Custo por conversa', `${num(t.alcance)} de alcance`)}
    </div>
    ${card('Detalhamento por Campanha', 'ordenado por conversas ↓',
      tabelaMeta(cs, t) +
      barras('Investimento por Campanha', cs.slice().sort((a, b) => b.investimento - a.investimento).map(c => ({ nome: c.nome, valor: c.investimento })), 'var(--meta)', brl0) +
      barras('Conversas por Campanha', cs.map(c => ({ nome: c.nome, valor: c.conversas })), 'var(--teal)', v => num(v) + ' conv.')
    )}
  </div>`;
}

/* ═══════════════════════════════════════════════════════════════════════
   SEÇÃO · TODAS AS CAMPANHAS
   ═══════════════════════════════════════════════════════════════════════ */
function secTodas(mes) {
  const g = (mes.google || []).slice().sort((a, b) => b.investimento - a.investimento);
  const m = (mes.meta || []).slice().sort((a, b) => b.investimento - a.investimento);
  const tg = somaGoogle(g), tm = somaMeta(m);
  return `<div class="wrap">
    <div class="ey">Google + Meta · ${esc(mes.rotulo)}${mes.parcial ? ' (parcial)' : ''}</div>
    <h1 class="ttl">Todas as Campanhas Ativas</h1>
    <p class="sub">${g.length + m.length} campanhas com veiculação em ${mes.periodo}.</p>
    ${g.length ? `<div class="ey" style="color:var(--google);margin-bottom:12px">Google Ads · ${g.length} campanhas</div>
      <div class="tcard" style="margin-bottom:28px">${tabelaGoogle(g, tg)}</div>` : ''}
    ${m.length ? `<div class="ey" style="color:var(--meta);margin-bottom:12px">Meta Ads · ${m.length} campanhas</div>
      <div class="tcard">${tabelaMeta(m, tm)}</div>` : ''}
  </div>`;
}

function vazio(titulo, texto) {
  return `<div class="wrap">
    <h1 class="ttl">${titulo}</h1>
    <p class="sub">${texto}</p>
  </div>`;
}

/* ═══════════════════════════════════════════════════════════════════════
   ESTADO INICIAL — enquanto não há mês carregado
   ═══════════════════════════════════════════════════════════════════════ */
const PENDENCIAS = [
  { st: 'block', t: 'Conta de anúncios do Meta Ads da Mais Med',
    d: 'É preciso o ID da conta de anúncios (<code>act_…</code>) e que ela esteja compartilhada com a BM que a Clintia usa. Hoje a conexão do Meta Ads da Clintia enxerga 108 contas e nenhuma é da Mais Med — sem esse compartilhamento não há como puxar investimento, conversas, impressões e alcance.' },
  { st: 'block', t: 'Conta do Google Ads da Mais Med',
    d: 'É preciso o ID da conta (CID, formato <code>000-000-0000</code>) e o export mensal da aba <strong>Campanhas</strong> com as colunas Custo, Impr., Cliques e Conversões — é assim que o relatório da Alpha é alimentado. Alternativa: acesso de leitura à conta para exportar direto.' },
  { st: 'ok', t: 'Definição do que conta como resultado',
    d: 'No modelo da Alpha, Google = <strong>leads</strong> (conversões) e Meta = <strong>conversas iniciadas</strong>. Confirmar se vale o mesmo para a Mais Med, já que aqui o canal de marcação é o WhatsApp.' },
  { st: 'ok', t: 'Recorte e periodicidade',
    d: 'Um bloco por mês, com o mês corrente marcado como parcial. Definir a partir de qual mês o relatório começa — a primeira campanha (pediatria, Cláusula 6) é o marco zero.' },
  { st: 'ok', t: 'Orçamento planejado por especialidade',
    d: 'Verba diária prevista por especialidade em cada plataforma. Alimenta os blocos <em>Investimento Diário por Especialidade</em> e <em>Orçamento Esperado x Investido Real</em>.' },
  { st: 'ok', t: 'Publicação',
    d: 'Deploy na Vercel a partir deste repositório, servido em <code>/dashboard</code>, com <code>X-Robots-Tag: noindex</code> já configurado no <code>vercel.json</code>.' }
];

function telaSetup() {
  return `<div class="hdr"><div class="hdr-row">
      <div class="brand"><div class="brand-dot"></div><span class="brand-name">${DADOS.cliente}</span></div>
      <span class="period-chip">Aguardando primeiro recorte</span>
    </div></div>
    <div class="setup">
      <div class="ey">Relatório de Performance · Google Ads + Meta Ads</div>
      <h1>Dashboard pronto — falta ligar as contas</h1>
      <p class="lead">A estrutura do relatório está construída e espelha a da Alpha Policlínica: visão consolidada, aba por plataforma e lista completa de campanhas, com seletor de mês. Todos os números — CPL, CPR, CTR, ritmo diário, projeções e percentuais — são calculados sozinhos. Falta apenas o acesso aos dados das contas da Mais Med.</p>
      ${PENDENCIAS.map((p, i) => `<div class="step">
        <div class="step-num">${i + 1}</div>
        <div>
          <div class="step-ttl">${p.t}<span class="pend ${p.st}">${p.st === 'block' ? 'bloqueia' : 'definir'}</span></div>
          <div class="step-txt">${p.d}</div>
        </div>
      </div>`).join('')}
      <div class="step" style="margin-top:22px;background:var(--s2)">
        <div class="step-num">↓</div>
        <div>
          <div class="step-ttl">Como carregar um mês</div>
          <div class="step-txt">Abra <code>dashboard.html</code>, localize a constante <code>DADOS.meses</code> no topo do bloco de script e acrescente um objeto de mês seguindo a estrutura documentada logo acima dela. Nada mais precisa ser alterado — a página se monta a partir desse objeto.</div>
        </div>
      </div>
    </div>
    <div class="foot">${DADOS.cliente} · Relatório operado por ${DADOS.operador} · Documento confidencial</div>`;
}

/* ═══════════════════════════════════════════════════════════════════════
   MONTAGEM E NAVEGAÇÃO
   ═══════════════════════════════════════════════════════════════════════ */
const ABAS = [
  { id: 'geral',  rotulo: 'Visão Geral',        render: secGeral },
  { id: 'google', rotulo: 'Google Ads',         render: secGoogle },
  { id: 'meta',   rotulo: 'Meta Ads',           render: secMeta },
  { id: 'todas',  rotulo: 'Todas as Campanhas', render: secTodas }
];

let mesAtual = DADOS.meses.length ? DADOS.meses[0].id : null;
let abaAtual = 'geral';

function render() {
  const app = document.getElementById('app');

  if (!DADOS.meses.length) { app.innerHTML = telaSetup(); return; }

  const mes = DADOS.meses.find(m => m.id === mesAtual) || DADOS.meses[0];

  const seletor = DADOS.meses.length > 1 ? `<div class="switch"><div class="switch-inner">
    ${DADOS.meses.map(m => `<button class="switch-btn ${m.id === mes.id ? 'active' : ''}" data-mes="${m.id}">${esc(m.rotulo)}</button>`).join('')}
  </div></div>` : '';

  app.innerHTML = seletor + `
    <div class="hdr">
      <div class="hdr-row">
        <div class="brand"><div class="brand-dot"></div><span class="brand-name">${DADOS.cliente}</span></div>
        <span class="period-chip">${esc(mes.rotulo)} · ${esc(mes.periodo)}${mes.parcial ? ' (parcial)' : ''}</span>
      </div>
      <div class="tabs">
        ${ABAS.map(a => `<button class="tab ${a.id === abaAtual ? 'on' : ''}" data-aba="${a.id}">${a.rotulo}</button>`).join('')}
      </div>
    </div>
    <div class="sec on">${(ABAS.find(a => a.id === abaAtual) || ABAS[0]).render(mes)}</div>
    <div class="foot">${DADOS.cliente} · Relatório operado por ${DADOS.operador} · Documento confidencial</div>`;
}

document.addEventListener('click', e => {
  const btnMes = e.target.closest('[data-mes]');
  if (btnMes) { mesAtual = btnMes.dataset.mes; abaAtual = 'geral'; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  const btnAba = e.target.closest('[data-aba]');
  if (btnAba) { abaAtual = btnAba.dataset.aba; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
});

render();
</script>

</body>
</html>
